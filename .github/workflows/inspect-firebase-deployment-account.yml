name: Inspect Firebase deployment account

"on": workflow_dispatch

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Identify deployment account
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VITEPLAY_DEV }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          credential = json.loads(os.environ["FIREBASE_CREDENTIAL"])
          email = credential["client_email"]
          project = credential["project_id"]
          if credential["type"] != "service_account":
              raise SystemExit("Expected a service-account credential")
          if not re.fullmatch(r"[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com", email):
              raise SystemExit("Unexpected service-account email format")
          if not re.fullmatch(r"[a-z0-9-]+", project):
              raise SystemExit("Unexpected project ID format")
          print("Firebase deployment account: " + email)
          print("Firebase credential project: " + project)
          PY
